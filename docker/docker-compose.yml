networks:
  twolink-internal:
    driver: bridge

volumes:
  postgres-data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=32MB"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - twolink-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  xray:
    build:
      context: ../xray
    restart: unless-stopped
    environment:
      XRAY_VLESS_PORT: ${XRAY_VLESS_PORT}
      XRAY_SS_PORT: ${XRAY_SS_PORT}
      XRAY_API_PORT: ${XRAY_API_PORT}
      REALITY_DEST: ${REALITY_DEST}
      REALITY_SERVER_NAMES: ${REALITY_SERVER_NAMES}
      REALITY_PRIVATE_KEY: ${REALITY_PRIVATE_KEY}
      REALITY_SHORT_ID: ${REALITY_SHORT_ID}
      SHADOWSOCKS_METHOD: ${SHADOWSOCKS_METHOD}
      SHADOWSOCKS_PASSWORD: ${SHADOWSOCKS_PASSWORD}
    ports:
      - "${XRAY_VLESS_PORT}:${XRAY_VLESS_PORT}"
      - "${XRAY_SS_PORT}:${XRAY_SS_PORT}/tcp"
      - "${XRAY_SS_PORT}:${XRAY_SS_PORT}/udp"
    networks:
      - twolink-internal
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      DATABASE_URL: ${DATABASE_URL}
      BACKEND_INTERNAL_API_KEY: ${BACKEND_INTERNAL_API_KEY}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      NODE_ID: ${NODE_ID}
      NODE_HOST: ${NODE_HOST}
      XRAY_VLESS_PORT: ${XRAY_VLESS_PORT}
      XRAY_API_PORT: ${XRAY_API_PORT}
      REALITY_PUBLIC_KEY: ${REALITY_PUBLIC_KEY}
      REALITY_SHORT_ID: ${REALITY_SHORT_ID}
      REALITY_SERVER_NAMES: ${REALITY_SERVER_NAMES}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - twolink-internal
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    build:
      context: ../bot
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      BACKEND_INTERNAL_API_KEY: ${BACKEND_INTERNAL_API_KEY}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      NODE_ID: ${NODE_ID}
    depends_on:
      - backend
    networks:
      - twolink-internal
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
