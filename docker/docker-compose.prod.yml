services:
  postgres:
    security_opt:
      - no-new-privileges:true
    cpus: 0.5

  xray:
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /etc/xray/generated:mode=1777
      - /tmp:mode=1777
    cpus: 0.3

  backend:
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cpus: 0.5

  bot:
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cpus: 0.2
